# Builds the gallery (gallery/README.md) of main and deploys it to GitHub
# Pages, whose source must be set to GitHub Actions. Demo episodes that are
# not voiced get fixture narration, so no voice model is needed; contact
# sheets are assembled without FFmpeg.
name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the browser
        env:
          HYPERFRAMES_NO_TELEMETRY: "1"
        run: |
          node_modules/.bin/hyperframes browser ensure
          echo "HYPERFRAMES_BROWSER_PATH=$(node_modules/.bin/hyperframes browser path | tail -n 1)" >> "$GITHUB_ENV"

      - name: Build the gallery
        run: node cli/avatars.mjs gallery --out gallery/out

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gallery/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
