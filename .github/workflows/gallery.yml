# Builds the gallery (gallery/README.md) of main with the demo videos and
# deploys it to GitHub Pages, whose source must be set to GitHub Actions. The
# demo is voiced with the voice model from the Actions cache; the videos live
# in a render store kept in the Actions cache, so a run renders only the
# videos whose episode, narration, theme or library code changed. Caches
# cannot be overwritten, so a run that changes the store saves it under a new
# key, and the next run restores the newest one.
name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the browser
        env:
          HYPERFRAMES_NO_TELEMETRY: "1"
        run: |
          node_modules/.bin/hyperframes browser ensure
          echo "HYPERFRAMES_BROWSER_PATH=$(node_modules/.bin/hyperframes browser path | tail -n 1)" >> "$GITHUB_ENV"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the voice tool's packages
        run: python -m pip install --quiet --disable-pip-version-check -r voice/requirements.txt

      # The model files come from the engines' setup code.
      - name: Name the caches
        id: keys
        run: |
          {
            echo "voice-cache=${AVATARS_VOICE_CACHE:-$HOME/.cache/avatars-voice}"
            echo "voice-key=avatars-voice-$RUNNER_OS-$(cat voice/engines/*.py | sha256sum | cut -c1-16)"
            echo "store=$RUNNER_TEMP/gallery-store"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the voice model
        id: voice-model
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.voice-cache }}
          key: ${{ steps.keys.outputs.voice-key }}

      - name: Set up the voice model
        env:
          AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node cli/avatars.mjs voice-setup --project examples/demo

      - name: Save the voice model
        if: steps.voice-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.voice-cache }}
          key: ${{ steps.keys.outputs.voice-key }}

      - name: Voice the demo
        env:
          AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node cli/avatars.mjs voice --all --project examples/demo

      - name: Restore the render store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.store }}
          key: gallery-renders-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gallery-renders-run-

      - name: Build the gallery
        id: gallery
        env:
          AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
          STORE: ${{ steps.keys.outputs.store }}
        run: |
          mkdir -p "$STORE"
          find "$STORE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/store-before.txt"
          node cli/avatars.mjs gallery --out gallery/out --videos --store "$STORE"

      # After a failed run the store keeps what was rendered before the
      # failure, so a retry reuses it.
      - name: Compare the render store
        id: store
        if: ${{ !cancelled() && steps.keys.outcome == 'success' }}
        env:
          STORE: ${{ steps.keys.outputs.store }}
        run: |
          mkdir -p "$STORE"
          if find "$STORE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | cmp -s - "$RUNNER_TEMP/store-before.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the render store
        if: ${{ !cancelled() && steps.store.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.store }}
          key: gallery-renders-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gallery/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
