# Weekly version updates. A release must be a week old before an update
# proposes it (security updates do not wait). Updates of HyperFrames, GSAP,
# the fonts or the voice tool's packages can change pixels or sound and
# re-render every episode, so they come grouped per ecosystem. Requirements
# change only when they exclude the new version: exact pins move, while
# ranges keep their floors, which set the oldest supported versions (numpy's
# also the oldest Python), and npm updates only its lockfile for them.
version: 2
updates:
  # The SHA pins of the workflows and of the render action; one pull request
  # per action updates it in both places.
  - package-ecosystem: github-actions
    directories: ["/", "/integrations/github/render"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /voice
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(voice)
    groups:
      voice:
        patterns: ["*"]
