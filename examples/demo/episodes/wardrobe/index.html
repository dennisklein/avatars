<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Demo tour: looks and themes</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Looks and themes: episode.json dresses the host in the blazer-glasses
  // look and switches this episode to the daylight theme. docs/wardrobe.md
  // embeds the episode and shows the same episode.json.
  const EPISODE = [
    "{",
    '  "cast": { "host": { "look": "blazer-glasses" } },',
    '  "theme": "daylight"',
    "}",
  ].join("\n");

  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "wardrobe", title: "Demo tour: looks and themes", series: "Demo tour" })
    .intro({ chapter: "Hi again", kicker: "Demo tour", title: "Looks and themes", say: { id: "intro", cues: { different: "smug" } } })
    .talk({
      chapter: "A new outfit",
      kicker: "Demo tour",
      title: "Same presenter, new look",
      sub: "A look dresses the presenter, and a theme colours every scene.",
      chips: ["blazer-glasses", "daylight"],
      nameTag: {},
      say: { id: "outfit", mood: "happy", cues: { brighter: "joy" } },
    })
    .slide({
      chapter: "What a look changes",
      title: "What a look changes",
      say: [{ id: "look", mood: "neutral" }, { id: "look2", mood: "neutral", cues: { face: "happy" } }],
      bullets: [
        { icon: "user", title: "Parts", text: "hair, a top, eyewear and accessories", at: "look:parts" },
        { icon: "gear", title: "Colours by role", text: "a look may follow the theme's accent", at: "look2:colours" },
        { icon: "check", title: "The same face", text: "identity parts stay in every look", at: "look2:face" },
      ],
    })
    .slide({
      chapter: "What a theme sets",
      title: "What a theme sets",
      say: [{ id: "theme", mood: "neutral" }, { id: "theme2", mood: "happy" }],
      bullets: [
        { icon: "host", title: "Backgrounds and surfaces", text: "the page, cards, terminals and code", at: "theme:backgrounds" },
        { icon: "job", title: "Text and accents", text: "headings, body text and highlights", at: "theme:text" },
        { icon: "gear", title: "Fonts", text: "a sans and a monospace font", at: "theme:fonts" },
      ],
    })
    .code({
      chapter: "One episode, its own look",
      title: "One file per episode",
      say: [{ id: "file", mood: "neutral", cues: { defaults: "smug" } }, { id: "file2", mood: "happy" }],
      file: "episodes/wardrobe/episode.json",
      lang: "json",
      text: EPISODE,
      marks: [
        { text: '"look"', at: "file:sets" },
        { text: '"theme"', at: "file:both" },
      ],
      notes: [
        { icon: "check", text: "everything else comes from avatars.json", at: "file:defaults" },
        { icon: "gear", text: "a project's own looks and themes live in library/", at: "file2:library" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Your own project", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
