<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Demo tour: how this video was made</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

  /* The compare scene (registered in the script below): two columns of short
     rows. It uses only tokens, so it follows the episode's theme. */
  .cmp { position: absolute; left: 120px; top: 300px; width: 1300px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .cmp-col { display: flex; flex-direction: column; padding: 30px 36px 14px; border-radius: var(--av-radius-4xl); background: var(--av-slide-bullet-bg); border: 2px solid var(--av-color-border); }
  .cmp-col.accent { border-color: var(--av-color-accent); }
  .cmp-head { display: flex; align-items: center; gap: 22px; padding-bottom: 22px; }
  .cmp-head .icon { flex: none; width: 68px; height: 68px; border-radius: var(--av-radius-2xl); display: grid; place-items: center; background: var(--av-icon-bg); }
  .cmp-head .icon svg { width: 40px; height: 40px; }
  .cmp-name { font-family: var(--av-font-mono); font-size: var(--av-font-size-2xl); font-weight: var(--av-font-weight-bold); color: var(--av-color-text-strong); }
  .cmp-row { display: flex; align-items: center; gap: 18px; padding: 20px 0; border-top: 2px solid var(--av-color-border-subtle); font-size: var(--av-font-size-lg); color: var(--av-color-text); }
  .cmp-dot { flex: none; width: 12px; height: 12px; border-radius: var(--av-radius-circle); background: var(--av-color-text-muted); }
  .cmp-col.accent .cmp-dot { background: var(--av-color-accent); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // The demo tour: how a project makes a video with this library, using every
  // library scene and a scene of its own. docs/tour.md embeds the episode and
  // repeats every file and terminal line shown here; avatars check compares
  // them (grounding in avatars.json). The terminal session is a real run in a
  // project made by `avatars new project`.

  // A scene of the page's own: two columns of rows on the slide frame, which
  // brings the chapter label, title, corner shot, narration and cue timing.
  //   .compare({ chapter, title, say, columns: [{ title, icon, accent, at, rows: [{ text, at }] }] })
  Avatars.scenes.register("compare", function compare(ctx, o) {
    const f = ctx.slideFrame("compare", o);
    const items = [];
    const cols = (o.columns || []).map((c) => {
      const head = ctx.h("div", { class: "cmp-head" }, [ctx.icon(c.icon), ctx.h("div", { class: "cmp-name", text: c.title })]);
      items.push({ spec: c, el: head });
      const rows = (c.rows || []).map((r) => {
        const row = ctx.h("div", { class: "cmp-row" }, [ctx.h("span", { class: "cmp-dot" }), document.createTextNode(r.text)]);
        items.push({ spec: r, el: row });
        return row;
      });
      return ctx.h("div", { class: "cmp-col" + (c.accent ? " accent" : "") }, [head, ...rows]);
    });
    f.el.append(ctx.h("div", { class: "cmp" }, cols));
    Scenes.enter(ctx.tl, cols, f.t + 0.7, { stagger: 0.15 });
    f.narrate();
    items.forEach((it, i) => {
      const at = f.cue(it.spec, i);
      Scenes.enter(ctx.tl, it.el, at, { y: 24 });
      if (it.spec.at != null) ctx.glance(at, 0.8, -0.6, 0.1);
    });
  });

  // avatars.json of this project.
  const PROJECT = [
    "{",
    '  "cast": { "host": { "avatar": "sindy", "look": "hoodie" } },',
    '  "theme": "midnight",',
    '  "format": "landscape-1080p",',
    '  "brand": "brand/brand.json",',
    '  "lexicons": ["en-us/core", "./lexicon.json"],',
    '  "icons": ["core", "tech"],',
    '  "grounding": { "sources": ["docs"], "embed": "{{< video \\"{id}\\" >}}" }',
    "}",
  ].join("\n");
  const VOICE = [
    "intro                      2.37s  Hi there! Welcome to First steps.",
    "why                        6.13s  Every episode starts with why it matters. Name the viewer's",
    "steps                      7.34s  Then show the way there. Each line of narration is one beat,",
    "outro                      5.60s  That's the shape of an episode. Swap in your own lines and s",
  ].join("\n");
  const CHECK = [
    "first-steps: vendor/ was out of date; rebuilt",
    "",
    "first-steps: 0:27.3 (27.3 s), 4 chapters, 4 lines",
    "  0:00.0    4.1 s  Welcome",
    "          0:01.5  intro        Hi there! Welcome to First steps.",
    "  0:04.1    6.9 s  Why it matters",
    "          0:04.7  why          Every episode starts with why it matters. Name the viewer's pro…",
    "  0:11.1    8.1 s  The way there",
    "          0:11.7  steps        Then show the way there. Each line of narration is one beat, sc…",
    "  0:19.2    8.1 s  Wrap-up",
    "          0:19.9  outro        That's the shape of an episode. Swap in your own lines and scen…",
    "first-steps: 0 errors, 0 warnings",
  ].join("\n");
  const SHELL = "~/my-videos — bash";

  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "tour", title: "Demo tour: how this video was made", series: "Demo tour" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Demo tour", title: "How this video was made", say: "intro" })
    .talk({
      chapter: "Why plain files",
      kicker: "Demo tour",
      title: "Videos from plain files",
      sub: "Narration, scenes and checks are text: fix a line, render again.",
      chips: ["script.json", "index.html", "render on a CPU"],
      nameTag: {},
      say: [{ id: "welcome", mood: "thinking", cues: { plain: "happy" } }, { id: "agents", mood: "happy" }],
    })
    .diagram({
      chapter: "From script to video",
      title: "From script to video",
      say: [{ id: "pipe1", mood: "neutral" }, { id: "pipe2", mood: "neutral" }, { id: "pipe3", mood: "happy", cues: { changed: "smug" } }],
      shot: "mini",
      grid: [3, 2],
      nodeWidth: 330,
      nodes: [
        { id: "script", title: "script.json", text: "the narration", icon: "job", pos: [0, 0], at: "pipe1:script" },
        { id: "voice", title: "Voice", text: "audio and timings", icon: "user", pos: [1, 0], at: "pipe1:voice" },
        { id: "comp", title: "Composition", text: "scenes on a timeline", icon: "nodes", pos: [2, 0], at: "pipe2:composition" },
        { id: "render", title: "Render", text: "HyperFrames to MP4", icon: "host", accent: true, pos: [2, 1], at: "pipe2:HyperFrames" },
        { id: "publish", title: "Publish", text: "poster and captions", icon: "network", pos: [1, 1], at: "pipe3:Publish" },
        { id: "docs", title: "Your docs", text: "the video on its page", icon: "globe", ghost: true, pos: [0, 1], at: "pipe3:docs" },
      ],
      groups: [{ id: "ci", label: "avatars ci", around: ["render", "publish"], at: "pipe3:CI" }],
      edges: [
        { from: "script", to: "voice", label: "speaks", at: "pipe1:speaks" },
        { from: "voice", to: "comp", label: "timings", at: "pipe2:times" },
        { from: "comp", to: "render", at: "pipe2:renders" },
        { from: "render", to: "publish", label: "MP4", at: "pipe3:adds" },
        { from: "publish", to: "docs", label: "embed", dashed: true, at: "pipe3:ready" },
      ],
      pulse: [{ node: "render", at: "pipe3:changed" }],
    })
    .slide({
      chapter: "What a project keeps",
      title: "What a project keeps",
      say: [{ id: "keep", mood: "neutral" }, { id: "keep2", mood: "happy" }],
      bullets: [
        { icon: "globe", title: "Brand", text: "name, marks, links and colours", at: "keep:brand" },
        { icon: "user", title: "Lexicon", text: "how its own words are said", at: "keep:lexicon" },
        { icon: "job", title: "Episodes", text: "a script and a chain of scenes each", at: "keep:episodes" },
        { icon: "check", title: "Checks", text: "its own rules on top of avatars check", at: "keep:checks" },
      ],
    })
    .code({
      chapter: "The project file",
      title: "One file ties it together",
      say: [{ id: "cfg1", mood: "neutral", cues: { hoodie: "happy" } }, { id: "cfg2", mood: "happy" }],
      file: "avatars.json",
      lang: "json",
      text: PROJECT,
      reveal: [{ lines: [8, 8], at: "cfg2:Grounding" }],
      marks: [
        { text: '"cast"', at: "cfg1:casts", until: "cfg1:picks" },
        { text: '"theme"', at: "cfg1:theme", until: "cfg2:Grounding" },
        { text: '"format"', at: "cfg1:format", until: "cfg2:Grounding" },
        { text: '"brand"', at: "cfg1:brand", until: "cfg2:Grounding" },
        { text: '"grounding"', at: "cfg2:screen" },
      ],
      notes: [
        { icon: "globe", text: "brand/brand.json: name, marks and links", at: "cfg1:brand" },
        { icon: "check", text: "avatars check compares the screen with docs/tour.md", at: "cfg2:page" },
      ],
    })
    .terminal({
      chapter: "Start an episode",
      title: SHELL,
      say: [{ id: "new1", mood: "happy" }, { id: "new2", mood: "neutral" }, { id: "new3", mood: "neutral", cues: { now: "smug" } }],
      steps: [
        { cmd: "npx avatars new episode first-steps", at: "new1:Run" },
        { out: "created episodes/first-steps", at: "new1:out" },
        { cmd: "ls episodes/first-steps", at: "new2:It" },
        { out: "hyperframes.json  index.html  script.json", at: "new2:three" },
        { mark: "script.json", at: "new2:script", until: "new2:scenes" },
        { mark: "index.html", at: "new2:scenes", until: "new2:little" },
        { mark: "hyperframes.json", at: "new2:little", until: "new3:Then" },
        { cmd: "npx avatars fixture-voice first-steps", at: "new3:fixture" },
        { out: "fixture voice: episodes/first-steps", after: 0.4 },
      ],
    })
    .compare({
      chapter: "Two ways to narrate",
      title: "Two ways to narrate",
      say: [{ id: "cmp1", mood: "neutral" }, { id: "cmp2", mood: "neutral", cues: { cached: "happy" } }],
      columns: [
        {
          title: "fixture-voice",
          icon: "gear",
          at: "cmp1:Fixture",
          rows: [
            { text: "no speech model", at: "cmp1:speech" },
            { text: "instant", at: "cmp1:instant" },
            { text: "for layout and tests", at: "cmp1:layout" },
          ],
        },
        {
          title: "voice",
          icon: "user",
          accent: true,
          at: "cmp2:real",
          rows: [
            { text: "a speech model on your CPU", at: "cmp2:model" },
            { text: "cached line by line", at: "cmp2:cached" },
            { text: "voices only what changed", at: "cmp2:changed" },
          ],
        },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Voice and check",
      title: SHELL,
      say: [{ id: "chk1", mood: "neutral" }, { id: "chk2", mood: "neutral" }, { id: "chk3", mood: "joy" }],
      steps: [
        { cmd: "npx avatars voice first-steps", at: "chk1:real" },
        { ff: "⏩ fast-forward", at: "chk1:skip" },
        { out: VOICE, after: 1.2 },
        { cmd: "npx avatars check first-steps --quick", at: "chk2:check" },
        { out: CHECK, at: "chk2:prints" },
        { mark: "0 errors, 0 warnings", at: "chk3:Zero#0" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "take", mood: "happy" },
      bullets: [
        { icon: "job", title: "Two files you write", text: "script.json and index.html", at: "take:files" },
        { icon: "check", title: "Checked against the page", text: "avatars check, with grounding", at: "take:guards" },
        { icon: "host", title: "Rendered when it changes", text: "avatars ci and the render hash", at: "take:renders" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Looks and themes", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
