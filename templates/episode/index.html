<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>{{title}}</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  {{font-faces}}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // {{title}}. The narration is script.json: scenes say its lines by id, and
  // "line:word" times an item to the word that names it. Scene options are in
  // the README of each scene (scenes/<id>/README.md in the avatars package).
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "{{id}}", title: "{{title}}", series: "{{title}}" })
    .intro({ chapter: "Welcome", kicker: "Getting started", title: "{{title}}", say: "intro" })
    .talk({
      chapter: "Why it matters",
      kicker: "Getting started",
      title: "Start with why",
      sub: "The viewer's problem first, then what they'll have at the end.",
      chips: ["the problem", "the result"],
      nameTag: {},
      say: { id: "why", mood: "thinking", cues: { end: "happy" } },
    })
    .slide({
      chapter: "The way there",
      title: "One beat at a time",
      say: { id: "steps", mood: "neutral" },
      bullets: [
        { icon: "user", title: "Narration", text: "one short line per beat, in script.json", at: "steps:line" },
        { icon: "terminal", title: "Scenes", text: "a chain of scene calls in index.html", at: "steps:scenes" },
        { icon: "check", title: "Cues", text: "items appear on the words that name them", at: "steps:words" },
      ],
    })
    .outro({ chapter: "Wrap-up", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
