<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Welcome to {{title}}</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  {{font-faces}}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // The first episode: the presenter introduces herself and the four steps
  // of making a video. The narration is script.json; "line:word" times an
  // item to the word that names it.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "hello", title: "Welcome to {{title}}", series: "{{title}}" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Welcome", title: "Your first video", say: "intro" })
    .talk({
      chapter: "Meet your presenter",
      kicker: "Welcome",
      title: "Your video presenter",
      sub: "Short tutorial videos, made from plain files and rendered on your own machine.",
      chips: ["short videos", "AI voice"],
      nameTag: {},
      say: { id: "me", mood: "happy", cues: { short: "joy" } },
    })
    .slide({
      chapter: "How a video is made",
      title: "Four steps per video",
      say: { id: "how", mood: "neutral" },
      bullets: [
        { icon: "job", title: "Write", text: "the narration in script.json, the scenes in index.html", at: "how:write" },
        { icon: "user", title: "Voice", text: "every line spoken, with word timings", at: "how:voice" },
        { icon: "check", title: "Check", text: "the timeline, warnings and stills", at: "how:check" },
        { icon: "host", title: "Render", text: "an MP4 with captions", at: "how:render" },
      ],
    })
    .terminal({
      chapter: "Your next episode",
      say: [{ id: "next", mood: "happy" }, { id: "fixture", mood: "neutral", cues: { right: "smug" } }],
      steps: [
        { cmd: "npx avatars new episode second-steps", at: "next:Run" },
        { out: "created episodes/second-steps", after: 0.4 },
        { cmd: "npx avatars fixture-voice second-steps", at: "fixture:Fixture" },
        { out: "fixture voice: episodes/second-steps", after: 0.4 },
      ],
    })
    .outro({ chapter: "Wrap-up", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
