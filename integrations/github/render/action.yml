# Voices, renders and publishes a project's episodes with `avatars ci`. Renders
# live in a store directory kept in the Actions cache, one entry per render
# hash, so a run renders only the episodes whose sources, narration or library
# changed. Caches cannot be overwritten, so every run that changes the store
# saves it under a new key, and the next run restores the newest one. When
# every episode is in the store, the run needs neither FFmpeg, the voice model
# nor a browser and skips setting them up. README.md has a full workflow.
name: Render avatars episodes
description: Voice, render and publish the episodes of an avatars project, with renders kept in the Actions cache
author: Dennis Klein

inputs:
  project:
    description: The project directory (the one with avatars.json), relative to the workspace; its npm dependencies must be installed
    default: "."
  store:
    description: The render store directory, relative to the workspace or absolute
    default: .avatars-store
  cache-key-prefix:
    description: Prefix of the store's cache keys; give every project or call in one workflow run its own
    default: avatars-renders
  python-version:
    description: Python version for the voice tool (3.10 to 3.13)
    default: "3.12"
  install-ffmpeg:
    description: Install FFmpeg with apt-get when episodes need rendering; "false" if the runner provides FFmpeg with libx264
    default: "true"

outputs:
  used:
    description: A file listing the store entries (<id>-<hash>) of every published episode, one per line
    value: ${{ steps.paths.outputs.used }}
  store:
    description: The absolute path of the store
    value: ${{ steps.paths.outputs.store }}
  rendered:
    description: The number of episodes that were not in the store, which this run rendered
    value: ${{ steps.plan.outputs.missing }}

runs:
  using: composite
  steps:
    - name: Locate the avatars package
      id: paths
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        STORE: ${{ inputs.store }}
        CACHE_KEY: ${{ inputs.cache-key-prefix }}
      run: |
        if ! pkg=$(node -p "require('path').dirname(require.resolve('@dennisklein/avatars/package.json'))"); then
          echo "::error::@dennisklein/avatars is not installed in ${PWD}; set up Node 22 and run npm ci there first"
          exit 1
        fi
        # HyperFrames as the package resolves it, as cli/lib/run.mjs does.
        hf=$(node -p "const p = require.resolve('hyperframes/package.json', { paths: [process.argv[1]] }), b = require(p).bin;
          require('path').join(require('path').dirname(p), typeof b === 'string' ? b : b.hyperframes)" "$pkg")
        case "$STORE" in
          /*) store=$STORE ;;
          "~"/*) store=$HOME/${STORE#"~/"} ;;
          *) store=$GITHUB_WORKSPACE/$STORE ;;
        esac
        {
          echo "package=$pkg"
          echo "cli=$pkg/cli/avatars.mjs"
          echo "hyperframes=$hf"
          echo "store=$store"
          echo "used=$RUNNER_TEMP/$CACHE_KEY-used.txt"
          echo "voice-cache=${AVATARS_VOICE_CACHE:-$HOME/.cache/avatars-voice}"
          # The model files come from the engines' setup code.
          echo "voice-key=avatars-voice-$RUNNER_OS-$(cat "$pkg"/voice/engines/*.py | sha256sum | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the render store
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.store }}
        key: ${{ inputs.cache-key-prefix }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ inputs.cache-key-prefix }}-run-

    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Hashing needs Python (the voice tool's cache keys), but not the model.
    - name: Find episodes to render
      id: plan
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
        CLI: ${{ steps.paths.outputs.cli }}
        STORE: ${{ steps.paths.outputs.store }}
        CACHE_KEY: ${{ inputs.cache-key-prefix }}
      run: |
        mkdir -p "$STORE"
        find "$STORE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/$CACHE_KEY-before.txt"
        node "$CLI" hash --all --project . > "$RUNNER_TEMP/$CACHE_KEY-hashes.txt"
        total=0 missing=0
        while read -r key; do
          total=$((total + 1))
          [ -f "$STORE/$key/${key%-*}.json" ] || missing=$((missing + 1))
        done < "$RUNNER_TEMP/$CACHE_KEY-hashes.txt"
        echo "$missing of $total episodes to render"
        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    - name: Install FFmpeg
      if: steps.plan.outputs.missing != '0' && inputs.install-ffmpeg == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ffmpeg

    - name: Install the voice tool's packages
      if: steps.plan.outputs.missing != '0'
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PACKAGE: ${{ steps.paths.outputs.package }}
      run: |
        "$PYTHON" -m pip install --quiet --disable-pip-version-check -r "$PACKAGE/voice/requirements.txt"

    - name: Restore the voice model
      id: voice-model
      if: steps.plan.outputs.missing != '0'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.voice-cache }}
        key: ${{ steps.paths.outputs.voice-key }}

    - name: Set up the voice model
      if: steps.plan.outputs.missing != '0'
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
        CLI: ${{ steps.paths.outputs.cli }}
      run: node "$CLI" voice-setup --project .

    - name: Save the voice model
      if: steps.plan.outputs.missing != '0' && steps.voice-model.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.voice-cache }}
        key: ${{ steps.paths.outputs.voice-key }}

    # The Chrome Headless Shell build that this HyperFrames version renders with,
    # unless HYPERFRAMES_BROWSER_PATH names one.
    - name: Set up the browser
      id: browser
      if: steps.plan.outputs.missing != '0'
      shell: bash
      env:
        HYPERFRAMES: ${{ steps.paths.outputs.hyperframes }}
        HYPERFRAMES_NO_TELEMETRY: "1"
      run: |
        node "$HYPERFRAMES" browser ensure
        echo "path=$(node "$HYPERFRAMES" browser path | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Render and publish
      id: ci
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        AVATARS_PYTHON: ${{ steps.python.outputs.python-path }}
        CLI: ${{ steps.paths.outputs.cli }}
        STORE: ${{ steps.paths.outputs.store }}
        USED: ${{ steps.paths.outputs.used }}
        HYPERFRAMES_BROWSER_PATH: ${{ steps.browser.outputs.path || env.HYPERFRAMES_BROWSER_PATH }}
      run: |
        : > "$USED"
        node "$CLI" ci --all --project . --store "$STORE" --used "$USED"

    # After a failed run the store keeps everything, so a retry reuses what
    # was rendered before the failure.
    - name: Prune the render store
      id: prune
      if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
      shell: bash
      env:
        STORE: ${{ steps.paths.outputs.store }}
        USED: ${{ steps.paths.outputs.used }}
        CI_OUTCOME: ${{ steps.ci.outcome }}
        CACHE_KEY: ${{ inputs.cache-key-prefix }}
      run: |
        if [ "$CI_OUTCOME" = success ]; then
          for entry in "$STORE"/*; do
            [ -e "$entry" ] || continue
            name=$(basename "$entry")
            grep -qxF "$name" "$USED" && continue
            echo "pruned $name"
            rm -rf "$entry"
          done
        fi
        if find "$STORE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | cmp -s - "$RUNNER_TEMP/$CACHE_KEY-before.txt"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the render store
      if: ${{ !cancelled() && steps.prune.outputs.changed == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.store }}
        key: ${{ inputs.cache-key-prefix }}-run-${{ github.run_id }}-${{ github.run_attempt }}
